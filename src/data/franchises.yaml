# Every franchise the tour has had. Whether one is in Season 2 is decided by where its logo
# sits: assets/franchises/ (in) or assets/former franchises/ (out). Move the logo to change it.
# primary: the field colour from the dispatch banner. secondary: from the logo.
# ink: the text colour on the primary, dark or white.
# home: the region name shown on the site, and its NationStates region (leave region out for none).

- code: CSS
  name: Cannonballs
  logo: CSS.png
  primary: "#FCCB55"
  secondary: "#212E52"
  ink: dark
  home: { label: Commonwealth, region: commonwealth_of_sovereign_states }

